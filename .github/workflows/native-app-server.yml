# SPDX-License-Identifier: GPL-3.0-or-later

name: Ja App Server native matrix

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "app-server/**"
      - "contracts/**"
      - "tests/**"
      - "scripts/**"
      - ".cargo/**"
      - ".gitattributes"
      - ".gitignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "src-tauri/**"
      - "apps/desktop/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "eslint.config.mjs"
      - "prettier.config.mjs"
      - "vitest.config.ts"
      - "tsconfig*.json"
      - "LICENSE"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "app-server/**"
      - "contracts/**"
      - "tests/**"
      - "scripts/**"
      - ".cargo/**"
      - ".gitattributes"
      - ".gitignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "src-tauri/**"
      - "apps/desktop/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "eslint.config.mjs"
      - "prettier.config.mjs"
      - "vitest.config.ts"
      - "tsconfig*.json"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      release:
        description: "Build release bundles with Tauri updater signatures"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ja-native-app-server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-verification:
    name: Contracts and workspace verification
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Install pinned pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.33.0
          run_install: false

      - name: Install pinned Node.js and restore pnpm cache
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.10.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: liberica
          java-version: "25"
          cache: maven

      - name: Install uv for the contract and Python test runners
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7

      - name: Verify pinned toolchains
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'checkout commit differs from event commit' }
          if ((node --version).Trim() -ne 'v24.10.0') { throw 'Node.js version drifted from the locked project toolchain' }
          if ((pnpm --version).Trim() -ne '10.33.0') { throw 'pnpm version drifted from the locked project toolchain' }
          $javaVersion = java -version 2>&1 | Out-String
          if ($javaVersion -notmatch 'version "25(?:\.|\")') { throw 'Java 25 is required' }
          $mavenVersion = mvn.cmd -version | Out-String
          if ($mavenVersion -notmatch 'Java version: 25(?:\.|,)') { throw 'Maven is not using Java 25' }
          rustc --version
          cargo --version
          python --version
          uv --version

      - name: Install locked frontend dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile --prefer-offline --reporter=append-only

      - name: Cache Rust verification dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: ". -> src-tauri/target"
          shared-key: ja-windows-verification

      # 功能测试依赖系统 Windows PowerShell；先独立证明 runner 自身可启动它，
      # 并把 .NET/模块首次初始化与 Ja Job Object 行为区分开。
      - name: Verify system Windows PowerShell readiness
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive -Command "Write-Output 'JA_SYSTEM_POWERSHELL_READY'; exit 0"
          if ($LASTEXITCODE -ne 0) { throw "System Windows PowerShell failed: exit=$LASTEXITCODE" }

      - name: Verify product version projections
        shell: pwsh
        run: uv run --python 3.13 python -B scripts/version/product_version.py check

      - name: Run the complete cross-language contract gate
        shell: pwsh
        run: pwsh -NoProfile -File tests/contract/run.ps1

      # Jazzer 会在进程内安装全局 instrumentation；FFM/Win32 用例必须使用未插桩 JVM。
      # 两个 fuzz 方法由紧随其后的独立 Maven/JVM 步骤执行，仍是必需门禁。
      - name: Run JVM verification and build the Rust test fixture
        shell: pwsh
        run: mvn.cmd -B -ntp -f app-server/pom.xml "-Dtest=!ProviderInputFuzzTest" verify

      - name: Fuzz Provider Retry-After parsing
        shell: pwsh
        env:
          JAZZER_FUZZ: "1"
        run: mvn.cmd -B -ntp -f app-server/pom.xml "-Dtest=ProviderInputFuzzTest#retryAfterAlwaysStaysWithinTransportBudget" test

      - name: Fuzz strict Provider SSE parsing
        shell: pwsh
        env:
          JAZZER_FUZZ: "1"
        run: mvn.cmd -B -ntp -f app-server/pom.xml "-Dtest=ProviderInputFuzzTest#strictSseReaderFailsClosedForArbitraryBytes" test

      - name: Run frontend type, lint, test, and build gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build

      - name: Run repository architecture, attribution, and unused-code gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm check:architecture
          pnpm check:unused

      - name: Run the Rust workspace gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:JA_TEST_JAVA = (Get-Command java).Source
          $env:JA_TEST_JAR = (Resolve-Path 'app-server/target/ja-app-server.jar').Path
          cargo install cargo-machete --version 0.9.2 --locked
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo machete --with-metadata --skip-target-dir

      - name: Run Node script tests
        shell: pwsh
        run: node --test scripts/check-initial-baseline.test.mjs scripts/e2e/provider-smoke.test.mjs

      - name: Run Python script tests
        shell: pwsh
        run: uv run --python 3.13 --with 'jsonschema[format]==4.26.0' python -B -m unittest scripts.version.test_product_version scripts.native.test_collect_bundle_evidence scripts.native.test_run_sidecar_smoke scripts.native.test_stage_sidecar

      - name: Run PowerShell script tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scratch = ".tmp/verification/ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          pwsh -NoProfile -File scripts/verification/test-production-verification.ps1 -ScratchDirectory $scratch
          pwsh -NoProfile -File scripts/release/sbom/test-sbom-scripts.ps1

  native-app-server:
    name: App Server (${{ matrix.platform }} / ${{ matrix.arch }})
    needs: fast-verification
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            arch: x86_64
            targetTriple: x86_64-pc-windows-msvc
            tauriBundle: nsis
            bundleExtension: .exe
            runner: windows-2025
            nikSuffix: windows-amd64
            nikSha256: 8F8DBA29A26B0436C8A8A599F9C1A9C46929C417790C85788C2CD99DAF212B7A
          - platform: macos
            arch: x86_64
            targetTriple: x86_64-apple-darwin
            tauriBundle: dmg
            bundleExtension: .dmg
            runner: macos-26-intel
            nikSuffix: macos-amd64
            nikSha256: 0BC3B9B18ED89275FA3992D25863310734EEED0C79673210708C44369B835310
          - platform: macos
            arch: arm64
            targetTriple: aarch64-apple-darwin
            tauriBundle: dmg
            bundleExtension: .dmg
            runner: macos-26
            nikSuffix: macos-aarch64
            nikSha256: 8C74D049FA2B83A6A23F6981293EC956E7195C5FF546B8EB0DD20DF0BD92A99B
    env:
      # Only an explicitly requested release dispatch builds updater-signed bundles. Release
      # bundles remain unsigned by the operating systems while updater signatures stay enabled.
      JA_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true }}
      NIK_VERSION: 25.0.3+2
      NIK_JAVA_VERSION: 25.0.3+12
      NIK_URL: https://download.bell-sw.com/vm/25.0.3/bellsoft-liberica-vm-openjdk25.0.3%2B12-25.0.3%2B2-${{ matrix.nikSuffix }}.zip
      NIK_SHA256: ${{ matrix.nikSha256 }}

    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Install uv for the native verifier
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9

      - name: Cache target-specific Rust build dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: ". -> src-tauri/target"
          shared-key: ja-native-${{ matrix.platform }}-${{ matrix.arch }}

      - name: Verify source commit and native contract (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'checkout commit differs from event commit' }
          if (-not (Select-String -LiteralPath 'app-server/pom.xml' -Pattern '<buildArg>--no-fallback</buildArg>' -Quiet)) { throw 'Native Image fallback is not explicitly disabled' }
          $evidence = Join-Path $env:RUNNER_TEMP 'ja-native-evidence'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          "JA_NATIVE_EVIDENCE=$evidence" | Add-Content -Path $env:GITHUB_ENV
          python --version

      - name: Verify source commit and native contract (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fq '<buildArg>--no-fallback</buildArg>' app-server/pom.xml
          evidence="$RUNNER_TEMP/ja-native-evidence"
          mkdir -p "$evidence"
          printf 'JA_NATIVE_EVIDENCE=%s\n' "$evidence" >> "$GITHUB_ENV"
          python3 --version
          test "$(uname -m)" = "${{ matrix.arch }}"

      - name: Install pinned pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.33.0
          run_install: false

      - name: Install pinned Node.js and restore pnpm cache
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.10.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked frontend dependencies (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm install --frozen-lockfile --prefer-offline --reporter=append-only

      - name: Install locked frontend dependencies (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: pnpm install --frozen-lockfile --prefer-offline --reporter=append-only

      - name: Verify frontend and Tauri toolchain (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --version
          if ((node --version).Trim() -ne 'v24.10.0') { throw 'Node.js version drifted from the locked project toolchain' }
          pnpm --version
          if ((pnpm --version).Trim() -ne '10.33.0') { throw 'pnpm version drifted from the locked project toolchain' }
          pnpm exec tauri --version

      - name: Verify frontend and Tauri toolchain (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          node --version
          test "$(node --version)" = "v24.10.0"
          test "$(pnpm --version)" = "10.33.0"
          pnpm exec tauri --version

      - name: Install pinned Liberica NIK (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'liberica-nik.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'liberica-nik'
          Invoke-WebRequest -Uri $env:NIK_URL -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actual -ne $env:NIK_SHA256) { throw "NIK checksum mismatch: $actual" }
          if (Test-Path -LiteralPath $extract) { Remove-Item -LiteralPath $extract -Recurse -Force }
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $nik = Get-ChildItem -LiteralPath $extract -Directory -Recurse |
            Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName 'bin/native-image.cmd') } |
            Select-Object -First 1
          if ($null -eq $nik) { throw 'Liberica NIK native-image.cmd was not found' }
          "JAVA_HOME=$($nik.FullName)" | Add-Content -Path $env:GITHUB_ENV
          "NIK_HOME=$($nik.FullName)" | Add-Content -Path $env:GITHUB_ENV
          $nik.FullName + '\bin' | Add-Content -Path $env:GITHUB_PATH

      - name: Install pinned Liberica NIK (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/liberica-nik.zip"
          extract="$RUNNER_TEMP/liberica-nik"
          curl --fail --location --retry 3 --retry-delay 2 --proto '=https' --tlsv1.2 "$NIK_URL" -o "$archive"
          printf '%s  %s\n' "$NIK_SHA256" "$archive" | shasum -a 256 --check
          rm -rf "$extract"
          mkdir -p "$extract"
          unzip -q "$archive" -d "$extract"
          nik_home="$(find "$extract" -path '*/Contents/Home/bin/native-image' -print -quit | sed 's#/bin/native-image$##')"
          test -n "$nik_home"
          test -x "$nik_home/bin/java"
          test -x "$nik_home/bin/native-image"
          printf 'JAVA_HOME=%s\n' "$nik_home" >> "$GITHUB_ENV"
          printf 'NIK_HOME=%s\n' "$nik_home" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$nik_home" >> "$GITHUB_PATH"

      - name: Verify pinned toolchain (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((Get-Command native-image.cmd).Source -notlike "$env:NIK_HOME*") { throw 'native-image is not from pinned NIK' }
          java -version 2>&1 | Tee-Object -FilePath (Join-Path $env:JA_NATIVE_EVIDENCE 'java-version.txt')
          native-image.cmd --version | Tee-Object -FilePath (Join-Path $env:JA_NATIVE_EVIDENCE 'native-image-version.txt')
          mvn.cmd --version | Tee-Object -FilePath (Join-Path $env:JA_NATIVE_EVIDENCE 'maven-version.txt')
          Select-String -LiteralPath (Join-Path $env:JA_NATIVE_EVIDENCE 'java-version.txt') -Pattern '25.0.3' -Quiet
          Select-String -LiteralPath (Join-Path $env:JA_NATIVE_EVIDENCE 'native-image-version.txt') -Pattern '25.0.3' -Quiet

      - name: Verify pinned toolchain (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          test "$(command -v native-image)" = "$NIK_HOME/bin/native-image"
          java -version 2>&1 | tee "$JA_NATIVE_EVIDENCE/java-version.txt"
          native-image --version | tee "$JA_NATIVE_EVIDENCE/native-image-version.txt"
          mvn --version | tee "$JA_NATIVE_EVIDENCE/maven-version.txt"
          grep -Fq '25.0.3' "$JA_NATIVE_EVIDENCE/java-version.txt"
          grep -Fq '25.0.3' "$JA_NATIVE_EVIDENCE/native-image-version.txt"

      # fast-verification owns JVM tests and verify-bound quality gates once on Windows.
      # Matrix jobs only build each platform artifact and prove it through the native smoke below.
      - name: Generate CycloneDX SBOM (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: mvn.cmd -B -ntp -f app-server/pom.xml org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom -DskipTests -DoutputFormat=json -DoutputName=ja-app-server -DoutputDirectory="$env:JA_NATIVE_EVIDENCE"

      - name: Generate CycloneDX SBOM (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: mvn -B -ntp -f app-server/pom.xml org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom -DskipTests -DoutputFormat=json -DoutputName=ja-app-server -DoutputDirectory="$JA_NATIVE_EVIDENCE"

      - name: Build App Server Native Image (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          @echo on
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64
          call mvn.cmd -B -ntp -f app-server/pom.xml -Pnative -DskipTests clean package
          if not exist app-server\target\ja-app-server.exe exit /b 1
          dumpbin /headers app-server\target\ja-app-server.exe | findstr /I /C:"machine (x64)"

      - name: Build App Server Native Image (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f app-server/pom.xml -Pnative -DskipTests clean package
          test -x app-server/target/ja-app-server
          file app-server/target/ja-app-server | tee "$JA_NATIVE_EVIDENCE/file.txt"
          grep -Fq '${{ matrix.arch }}' "$JA_NATIVE_EVIDENCE/file.txt"
          otool -L app-server/target/ja-app-server | tee "$JA_NATIVE_EVIDENCE/otool.txt"
          if grep -Eiq 'java|jre|jdk' "$JA_NATIVE_EVIDENCE/otool.txt"; then
            echo 'Native Image executable links to a JVM runtime' >&2
            exit 1
          fi

      - name: Run real production startup/shutdown smoke (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $data = Join-Path $env:RUNNER_TEMP 'Ja App Server\unicode 空格 data'
          $artifactPath = Join-Path $PWD 'app-server/target/ja-app-server.exe'
          $artifact = Get-Item -LiteralPath $artifactPath -ErrorAction Stop
          $maxBytes = [int64]104857600
          if ($artifact.Length -le 0 -or $artifact.Length -gt $maxBytes) { throw 'fresh native executable is missing, empty, or over the approved size limit' }
          $sha256 = (Get-FileHash -LiteralPath $artifactPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $unixEpochTicks = [DateTime]::new(1970, 1, 1, 0, 0, 0, [DateTimeKind]::Utc).Ticks
          $mtimeNs = [int64](($artifact.LastWriteTimeUtc.Ticks - $unixEpochTicks) * 100L)
          $smokePath = Join-Path $env:JA_NATIVE_EVIDENCE 'smoke.json'
          $smokeArguments = @('-B', 'scripts/native/run-sidecar-smoke.py', '--executable', $artifactPath, '--data-dir', $data, '--output', $smokePath, '--expected-sha256', $sha256, '--expected-size', [string]$artifact.Length, '--expected-mtime-ns', [string]$mtimeNs)
          & uv run --python 3.13 --with 'jsonschema[format]==4.26.0' python @smokeArguments
          if ($LASTEXITCODE -ne 0) { throw "native sidecar smoke failed with exit code $LASTEXITCODE" }
          $report = Get-Content -LiteralPath $smokePath -Raw | ConvertFrom-Json
          $executableProperty = $report.PSObject.Properties['executable']
          $matchedProperty = if ($null -ne $executableProperty) { $executableProperty.Value.PSObject.Properties['expectedIdentityMatched'] } else { $null }
          if ($report.status -ne 'passed' -or $null -eq $matchedProperty -or $matchedProperty.Value -ne $true) { throw 'native smoke report did not prove expected executable identity' }

      - name: Run real production startup/shutdown smoke (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          data="$RUNNER_TEMP/Ja App Server/unicode 空格 data"
          artifact='app-server/target/ja-app-server'
          identity="$(python3 - "$artifact" <<'PY'
          import hashlib
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          stat = path.stat()
          digest = hashlib.sha256()
          with path.open('rb') as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                  digest.update(chunk)
          print(f"{digest.hexdigest()}\t{stat.st_size}\t{stat.st_mtime_ns}")
          PY
          )"
          IFS=$'\t' read -r sha256 size_bytes mtime_ns <<< "$identity"
          if [ -z "$sha256" ] || [ -z "$size_bytes" ] || [ -z "$mtime_ns" ] || [ "$size_bytes" -le 0 ] || [ "$size_bytes" -gt 104857600 ]; then
            echo 'fresh native executable is missing, empty, over the approved size limit, or has incomplete identity' >&2
            exit 1
          fi
          smoke="$JA_NATIVE_EVIDENCE/smoke.json"
          uv run --python 3.13 --with 'jsonschema[format]==4.26.0' python -B scripts/native/run-sidecar-smoke.py --executable "$artifact" --data-dir "$data" --output "$smoke" --expected-sha256 "$sha256" --expected-size "$size_bytes" --expected-mtime-ns "$mtime_ns"
          python3 - "$smoke" <<'PY'
          import json
          from pathlib import Path
          import sys
          report = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          executable = report.get('executable')
          if report.get('status') != 'passed' or not isinstance(executable, dict) or executable.get('expectedIdentityMatched') is not True:
              raise SystemExit('native smoke report did not prove expected executable identity')
          PY

      - name: Write checksum and build report (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B scripts/native/make-build-report.py --artifact app-server/target/ja-app-server.exe --sbom (Join-Path $env:JA_NATIVE_EVIDENCE 'ja-app-server.json') --smoke (Join-Path $env:JA_NATIVE_EVIDENCE 'smoke.json') --output (Join-Path $env:JA_NATIVE_EVIDENCE 'build-report.json') --checksum-output (Join-Path $env:JA_NATIVE_EVIDENCE 'ja-app-server.exe.sha256') --platform windows --arch x86_64 --runner '${{ matrix.runner }}' --source-commit $env:GITHUB_SHA --nik-version $env:NIK_VERSION --nik-java-version $env:NIK_JAVA_VERSION --nik-sha256 $env:NIK_SHA256 --no-fallback

      - name: Write checksum and build report (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/native/make-build-report.py --artifact app-server/target/ja-app-server --sbom "$JA_NATIVE_EVIDENCE/ja-app-server.json" --smoke "$JA_NATIVE_EVIDENCE/smoke.json" --output "$JA_NATIVE_EVIDENCE/build-report.json" --checksum-output "$JA_NATIVE_EVIDENCE/ja-app-server.sha256" --platform macos --arch '${{ matrix.arch }}' --runner '${{ matrix.runner }}' --source-commit "$GITHUB_SHA" --nik-version "$NIK_VERSION" --nik-java-version "$NIK_JAVA_VERSION" --nik-sha256 "$NIK_SHA256" --no-fallback

      - name: Validate sidecar staging contract (Windows dry-run)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'ja-native-stage-dry-run'
          $dryRun = Join-Path $env:JA_NATIVE_EVIDENCE 'sidecar-dry-run.json'
          python -B scripts/native/stage-sidecar.py --artifact app-server/target/ja-app-server.exe --output-dir $stage --target-triple '${{ matrix.targetTriple }}' --platform windows --arch '${{ matrix.arch }}' --source-commit $env:GITHUB_SHA --build-report (Join-Path $env:JA_NATIVE_EVIDENCE 'build-report.json') --dry-run | Tee-Object -FilePath $dryRun
          if ($LASTEXITCODE -ne 0) { throw "sidecar dry-run failed with exit code $LASTEXITCODE" }

      - name: Stage Tauri sidecar resource (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'ja-native-stage'
          python -B scripts/native/stage-sidecar.py --artifact app-server/target/ja-app-server.exe --output-dir $stage --target-triple '${{ matrix.targetTriple }}' --platform windows --arch '${{ matrix.arch }}' --source-commit $env:GITHUB_SHA --build-report (Join-Path $env:JA_NATIVE_EVIDENCE 'build-report.json')

      - name: Validate sidecar staging contract (macOS dry-run)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/ja-native-stage-dry-run"
          python3 -B scripts/native/stage-sidecar.py --artifact app-server/target/ja-app-server --output-dir "$stage" --target-triple '${{ matrix.targetTriple }}' --platform macos --arch '${{ matrix.arch }}' --source-commit "$GITHUB_SHA" --build-report "$JA_NATIVE_EVIDENCE/build-report.json" --dry-run | tee "$JA_NATIVE_EVIDENCE/sidecar-dry-run.json"

      - name: Stage Tauri sidecar resource (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/ja-native-stage"
          python3 -B scripts/native/stage-sidecar.py --artifact app-server/target/ja-app-server --output-dir "$stage" --target-triple '${{ matrix.targetTriple }}' --platform macos --arch '${{ matrix.arch }}' --source-commit "$GITHUB_SHA" --build-report "$JA_NATIVE_EVIDENCE/build-report.json"

      - name: Run unsigned Tauri NSIS bundle smoke (Windows)
        if: matrix.platform == 'windows' && env.JA_RELEASE != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'ja-native-stage'
          $source = Join-Path $stage 'sidecars/ja-app-server-${{ matrix.targetTriple }}.exe'
          $sourceManifest = Join-Path $stage 'sidecar-manifest.json'
          $sidecars = Join-Path $PWD 'src-tauri/sidecars'
          $target = Join-Path $sidecars 'ja-app-server-${{ matrix.targetTriple }}.exe'
          $evidence = Join-Path $env:RUNNER_TEMP 'ja-tauri-bundle-evidence'
          New-Item -ItemType Directory -Force -Path $sidecars,$evidence | Out-Null
          try {
            if (-not (Test-Path -LiteralPath $source)) { throw 'staged Windows sidecar is missing' }
            if (-not (Test-Path -LiteralPath $sourceManifest)) { throw 'staged sidecar manifest is missing' }
            if (Test-Path -LiteralPath $target) { throw 'src-tauri/sidecars already contains the target sidecar' }
            Copy-Item -LiteralPath $source -Destination $target
            '{"noSign":true,"signingStatus":"unsigned","notarizationStatus":"not-run","command":"pnpm exec tauri build --ci --no-sign --bundles nsis"}' | Set-Content -LiteralPath (Join-Path $evidence 'bundle-contract.json') -Encoding utf8NoBOM
            pnpm exec tauri build --ci --no-sign --bundles nsis
            if ($LASTEXITCODE -ne 0) { throw "Tauri NSIS bundle failed with exit code $LASTEXITCODE" }
            python -B scripts/native/collect-bundle-evidence.py --bundle-dir 'src-tauri/target/release/bundle/nsis' --extension '${{ matrix.bundleExtension }}' --output-dir $evidence --platform windows --arch '${{ matrix.arch }}' --bundle '${{ matrix.tauriBundle }}' --source-commit $env:GITHUB_SHA --sidecar-manifest $sourceManifest --no-sign
            if ($LASTEXITCODE -ne 0) { throw "bundle evidence collection failed with exit code $LASTEXITCODE" }
          } finally {
            foreach ($path in @($target)) {
              if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force }
            }
          }
          if (Test-Path -LiteralPath $target) { throw 'generated Windows sidecar cleanup failed' }

      - name: Build Tauri NSIS bundle with updater signature (Windows)
        if: matrix.platform == 'windows' && env.JA_RELEASE == 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw 'Updater signing private key is missing' }
          $stage = Join-Path $env:RUNNER_TEMP 'ja-native-stage'
          $source = Join-Path $stage 'sidecars/ja-app-server-${{ matrix.targetTriple }}.exe'
          $sourceManifest = Join-Path $stage 'sidecar-manifest.json'
          $sidecars = Join-Path $PWD 'src-tauri/sidecars'
          $target = Join-Path $sidecars 'ja-app-server-${{ matrix.targetTriple }}.exe'
          $evidence = Join-Path $env:RUNNER_TEMP 'ja-tauri-bundle-evidence'
          New-Item -ItemType Directory -Force -Path $sidecars,$evidence | Out-Null
          try {
            if (-not (Test-Path -LiteralPath $source)) { throw 'staged Windows sidecar is missing' }
            if (-not (Test-Path -LiteralPath $sourceManifest)) { throw 'staged sidecar manifest is missing' }
            if (Test-Path -LiteralPath $target) { throw 'src-tauri/sidecars already contains the target sidecar' }
            Copy-Item -LiteralPath $source -Destination $target
            '{"noSign":false,"signingStatus":"unsigned","notarizationStatus":"not-run","command":"pnpm exec tauri build --ci --bundles nsis"}' | Set-Content -LiteralPath (Join-Path $evidence 'bundle-contract.json') -Encoding utf8NoBOM
            pnpm exec tauri build --ci --bundles nsis
            if ($LASTEXITCODE -ne 0) { throw "Tauri NSIS bundle with updater signature failed with exit code $LASTEXITCODE" }
            python -B scripts/native/collect-bundle-evidence.py --bundle-dir 'src-tauri/target/release/bundle/nsis' --extension '${{ matrix.bundleExtension }}' --output-dir $evidence --platform windows --arch '${{ matrix.arch }}' --bundle '${{ matrix.tauriBundle }}' --source-commit $env:GITHUB_SHA --sidecar-manifest $sourceManifest --updater-signed
            if ($LASTEXITCODE -ne 0) { throw "bundle evidence collection failed with exit code $LASTEXITCODE" }
          } finally {
            foreach ($path in @($target)) {
              if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force }
            }
          }
          if (Test-Path -LiteralPath $target) { throw 'generated Windows sidecar cleanup failed' }

      - name: Run unsigned-system Windows installer install/launch/uninstall smoke
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Release and non-release bundles share the installer lifecycle check; the
          # operating-system signature is intentionally absent while updater signing stays separate.
          $installers = @(Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File | Sort-Object Name)
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count)" }
          $output = Join-Path $env:JA_NATIVE_EVIDENCE 'installer-smoke.json'
          & pwsh -NoProfile -File 'scripts/native/run-windows-installer-smoke.ps1' `
            -Installer $installers[0].FullName `
            -Output $output `
            -SourceCommit $env:GITHUB_SHA `
            -RequireUnsigned
          if ($LASTEXITCODE -ne 0) { throw "Windows installer smoke failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath $output -PathType Leaf)) { throw 'installer smoke evidence is missing' }

      - name: Run unsigned Tauri DMG bundle smoke (macOS)
        if: matrix.platform == 'macos' && env.JA_RELEASE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/ja-native-stage"
          source="$stage/sidecars/ja-app-server-${{ matrix.targetTriple }}"
          source_manifest="$stage/sidecar-manifest.json"
          sidecars="src-tauri/sidecars"
          target="$sidecars/ja-app-server-${{ matrix.targetTriple }}"
          evidence="$RUNNER_TEMP/ja-tauri-bundle-evidence"
          mkdir -p "$sidecars" "$evidence"
          cleanup() {
            rm -f -- "$target"
          }
          trap cleanup EXIT
          test -f "$source"
          test -f "$source_manifest"
          test ! -e "$target"
          cp -- "$source" "$target"
          printf '%s\n' '{"noSign":true,"signingStatus":"unsigned","notarizationStatus":"not-run","command":"pnpm exec tauri build --ci --no-sign --bundles dmg"}' > "$evidence/bundle-contract.json"
          pnpm exec tauri build --ci --no-sign --bundles dmg
          python3 -B scripts/native/collect-bundle-evidence.py --bundle-dir 'src-tauri/target/release/bundle/dmg' --extension '${{ matrix.bundleExtension }}' --output-dir "$evidence" --platform macos --arch '${{ matrix.arch }}' --bundle '${{ matrix.tauriBundle }}' --source-commit "$GITHUB_SHA" --sidecar-manifest "$source_manifest" --no-sign
          cleanup
          trap - EXIT
          test ! -e "$target"

      - name: Build Tauri app and DMG with updater signature (macOS)
        if: matrix.platform == 'macos' && env.JA_RELEASE == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}"
          stage="$RUNNER_TEMP/ja-native-stage"
          source="$stage/sidecars/ja-app-server-${{ matrix.targetTriple }}"
          source_manifest="$stage/sidecar-manifest.json"
          sidecars="src-tauri/sidecars"
          target="$sidecars/ja-app-server-${{ matrix.targetTriple }}"
          evidence="$RUNNER_TEMP/ja-tauri-bundle-evidence"
          mkdir -p "$sidecars" "$evidence"
          cleanup() { rm -f -- "$target"; }
          trap cleanup EXIT
          test -f "$source"
          test -f "$source_manifest"
          test ! -e "$target"
          cp -- "$source" "$target"
          printf '%s\n' '{"noSign":false,"signingStatus":"unsigned","notarizationStatus":"not-run","command":"pnpm exec tauri build --ci --bundles app,dmg"}' > "$evidence/bundle-contract.json"
          pnpm exec tauri build --ci --bundles app,dmg
          python3 -B scripts/native/collect-bundle-evidence.py --bundle-dir 'src-tauri/target/release/bundle/dmg' --extension '${{ matrix.bundleExtension }}' --output-dir "$evidence" --platform macos --arch '${{ matrix.arch }}' --bundle '${{ matrix.tauriBundle }}' --source-commit "$GITHUB_SHA" --sidecar-manifest "$source_manifest" --updater-signed
          cleanup
          trap - EXIT
          test ! -e "$target"

      - name: Collect release SBOM evidence (Windows)
        if: matrix.platform == 'windows' && env.JA_RELEASE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:JA_NATIVE_EVIDENCE 'release-sbom'
          $bundle = (Resolve-Path 'src-tauri/target/release/bundle/nsis').Path
          # 无 target 的离线 metadata 覆盖全部平台依赖，先按 lock 补齐 registry 缓存。
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { throw 'Cargo SBOM dependency preparation failed' }
          pwsh -NoProfile -File scripts/release/sbom/generate.ps1 `
            -RepositoryRoot $PWD.Path `
            -OutputDirectory $output `
            -CargoToolchain stable `
            -MavenBomPath (Join-Path $env:JA_NATIVE_EVIDENCE 'ja-app-server.json') `
            -CorrespondingSourcePath $PWD.Path `
            -ArtifactPath $bundle
          if ($LASTEXITCODE -ne 0) { throw "release SBOM evidence generation failed: exit=$LASTEXITCODE" }
          $reportPath = Join-Path $output 'dependency-license-report.json'
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) { throw 'release SBOM report is missing' }
          $report = Get-Content -Raw -LiteralPath $reportPath | ConvertFrom-Json
          "Release SBOM evidence status: $($report.status)" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          Get-Content -Raw -LiteralPath $reportPath | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Collect release SBOM evidence (macOS)
        if: matrix.platform == 'macos' && env.JA_RELEASE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:JA_NATIVE_EVIDENCE 'release-sbom'
          $bundle = (Resolve-Path 'src-tauri/target/release/bundle/dmg').Path
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { throw 'Cargo SBOM dependency preparation failed' }
          pwsh -NoProfile -File scripts/release/sbom/generate.ps1 `
            -RepositoryRoot $PWD.Path `
            -OutputDirectory $output `
            -CargoToolchain stable `
            -MavenBomPath (Join-Path $env:JA_NATIVE_EVIDENCE 'ja-app-server.json') `
            -CorrespondingSourcePath $PWD.Path `
            -ArtifactPath $bundle
          if ($LASTEXITCODE -ne 0) { throw "release SBOM evidence generation failed: exit=$LASTEXITCODE" }
          $reportPath = Join-Path $output 'dependency-license-report.json'
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) { throw 'release SBOM report is missing' }
          $report = Get-Content -Raw -LiteralPath $reportPath | ConvertFrom-Json
          "Release SBOM evidence status: $($report.status)" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          Get-Content -Raw -LiteralPath $reportPath | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Reject secret markers in bounded evidence (Windows)
        if: always() && matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath $env:JA_NATIVE_EVIDENCE) {
            python -B scripts/release/check-evidence-secrets.py $env:JA_NATIVE_EVIDENCE
            if ($LASTEXITCODE -ne 0) { throw 'native evidence contains a credential value' }
          }

      - name: Reject secret markers in bounded evidence (macOS)
        if: always() && matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$JA_NATIVE_EVIDENCE" ]; then
            python3 -B scripts/release/check-evidence-secrets.py "$JA_NATIVE_EVIDENCE"
          fi

      - name: Publish build summary (Windows)
        if: always() && matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath (Join-Path $env:JA_NATIVE_EVIDENCE 'build-report.json')) {
            Get-Content -Raw (Join-Path $env:JA_NATIVE_EVIDENCE 'build-report.json') | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          } else {
            'Native build report was not produced.' | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }

      - name: Publish build summary (macOS)
        if: always() && matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$JA_NATIVE_EVIDENCE/build-report.json" ]; then
            cat "$JA_NATIVE_EVIDENCE/build-report.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Native build report was not produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish Tauri bundle summary (Windows)
        if: always() && matrix.platform == 'windows'
        shell: pwsh
        run: |
          $manifest = Join-Path $env:RUNNER_TEMP 'ja-tauri-bundle-evidence/tauri-bundle-manifest.json'
          if (Test-Path -LiteralPath $manifest) {
            Get-Content -Raw $manifest | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          } else {
            'Tauri bundle evidence was not produced; the bundle gate was incomplete.' | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }

      - name: Publish Tauri bundle summary (macOS)
        if: always() && matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/ja-tauri-bundle-evidence/tauri-bundle-manifest.json"
          if [ -f "$manifest" ]; then
            cat "$manifest" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Tauri bundle evidence was not produced; the bundle gate was incomplete.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload native build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ja-native-app-server-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            app-server/target/ja-app-server
            app-server/target/ja-app-server.exe
            ${{ runner.temp }}/ja-native-evidence
            ${{ runner.temp }}/ja-native-stage
            src-tauri/target/release/bundle/${{ matrix.tauriBundle }}
            src-tauri/target/release/bundle/macos
            ${{ runner.temp }}/ja-tauri-bundle-evidence
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

  updater-draft-release:
    name: Assemble updater draft
    if: github.event_name == 'workflow_dispatch' && inputs.release == true
    needs: native-app-server
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout exact verified source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Install pinned Node.js for release aggregation
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.10.0

      - name: Download every native matrix artifact separately
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ja-native-app-server-*
          path: ${{ runner.temp }}/ja-updater-input

      - name: Resolve release tag from the verified source version
        id: release
        env:
          JA_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$JA_SOURCE_COMMIT"
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "unsupported package version: $version" >&2
            exit 1
          fi
          echo "release_tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Generate the Tauri v2 static updater manifest
        env:
          JA_RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          JA_RELEASE_REPOSITORY: ${{ github.repository }}
          JA_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          published_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          node scripts/release/create-updater-manifest.mjs \
            --input "$RUNNER_TEMP/ja-updater-input" \
            --output "$RUNNER_TEMP/ja-updater-release" \
            --repository "$JA_RELEASE_REPOSITORY" \
            --tag "$JA_RELEASE_TAG" \
            --published-at "$published_at" \
            --source-commit "$JA_SOURCE_COMMIT"
          test -s "$RUNNER_TEMP/ja-updater-release/latest.json"

      - name: Create an unpublished GitHub draft with unsigned system bundles and signed updater assets
        env:
          GH_TOKEN: ${{ github.token }}
          JA_RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          JA_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$JA_SOURCE_COMMIT"
          if gh release view "$JA_RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace or mutate it: $JA_RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$JA_RELEASE_TAG" \
            "$RUNNER_TEMP"/ja-updater-release/* \
            --draft \
            --title "Ja $JA_RELEASE_TAG" \
            --notes-file "scripts/release/notes/${JA_RELEASE_TAG}.md" \
            --target "$JA_SOURCE_COMMIT"
