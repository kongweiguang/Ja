# 临时复现 Windows runner 准入失败；定位后删除，发布仍要求完整主 CI。
name: Ja process-session diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  JA_SOURCE_COMMIT: ${{ github.sha }}
jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 24.10.0
          cache: pnpm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: liberica
          java-version: "25"
          cache: maven
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: ". -> target"
          shared-key: ja-windows-verification
      - name: Prepare the identical pinned JVM and frontend fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          java -version
          mvn.cmd -version
          pnpm install --frozen-lockfile --prefer-offline --reporter=append-only
          pnpm exec playwright install chromium
          $stage = Join-Path $env:RUNNER_TEMP 'ja-jvm-search-tools'
          python -B scripts/native/stage-search-tools.py --output-dir $stage --platform windows --arch x86_64 --target-triple x86_64-pc-windows-msvc --source-commit $env:JA_SOURCE_COMMIT
          (Join-Path $stage 'sidecars/tools') | Add-Content -LiteralPath $env:GITHUB_PATH
          mvn.cmd -B -ntp -f ja-agent/pom.xml -pl ja-app-server -am -DskipTests package
      - name: Reproduce isolated WebView2 admission
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # 只比较身份关系，不读取文件正文或输出实际 SID；验证旧手写夹具在 elevated token 下的 owner 差异。
          $aclFixture = Join-Path $env:RUNNER_TEMP "ja-owner-fixture-$env:GITHUB_RUN_ID.json"
          [IO.File]::WriteAllText($aclFixture, '{}')
          $fixtureAccount = "$env:USERDOMAIN\$env:USERNAME"
          icacls.exe $aclFixture /inheritance:r /grant:r "$($fixtureAccount):(F)" | Out-Null
          $fixtureAcl = Get-Acl -LiteralPath $aclFixture
          $currentSid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $ownerSid = $fixtureAcl.GetOwner([Security.Principal.SecurityIdentifier]).Value
          $fixtureEntries = @($fixtureAcl.GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier]))
          @{ ownerMatchesCurrent = ($ownerSid -eq $currentSid); aceMatchesCurrent = ($fixtureEntries.Count -eq 1 -and $fixtureEntries[0].IdentityReference.Value -eq $currentSid); entryCount = $fixtureEntries.Count; protected = $fixtureAcl.AreAccessRulesProtected } | ConvertTo-Json -Compress
          Remove-Item -LiteralPath $aclFixture
          $jar = (Resolve-Path 'ja-agent/ja-app-server/target/ja-app-server.jar').Path
          node scripts/e2e/process-session-webview2.mjs --java-home $env:JAVA_HOME --jar $jar --evidence-directory .tmp/process-session-diagnostics
      - name: Preserve fixed-field failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ja-process-session-diagnostics
          path: |
            .tmp/process-session-diagnostics/*.json
            .tmp/process-session-diagnostics/launch-diagnostic.log
          retention-days: 2
