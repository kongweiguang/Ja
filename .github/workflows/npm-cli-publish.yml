# @author kongweiguang
# SPDX-License-Identifier: GPL-3.0-or-later

name: Publish Ja CLI to npm

on:
  workflow_call:
    inputs:
      source_commit:
        description: Exact verified main commit SHA
        required: true
        type: string
      native_run_id:
        description: Successful native-app-server push run for that commit
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        description: Optional granular token for the first package publication
        required: false
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact verified main commit SHA
        required: true
        type: string
      native_run_id:
        description: Successful native-app-server push run for that commit
        required: true
        type: string
permissions:
  contents: read
  actions: read

concurrency:
  group: ja-npm-kongweiguang-ja
  cancel-in-progress: false

jobs:
  publish-windows-x64:
    runs-on: windows-2025
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout the selected source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 1

      - name: Verify the commit and native evidence run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          JA_SOURCE_COMMIT: ${{ inputs.source_commit }}
          JA_NATIVE_RUN_ID: ${{ inputs.native_run_id }}
        run: |
          if ($env:JA_SOURCE_COMMIT -cnotmatch '^[0-9a-f]{40}$') { throw 'source_commit must be a full SHA' }
          if ($env:JA_NATIVE_RUN_ID -notmatch '^[1-9][0-9]*$') { throw 'native_run_id is invalid' }
          if ((git rev-parse HEAD).Trim() -cne $env:JA_SOURCE_COMMIT) { throw 'checkout differs from source_commit' }
          git fetch origin main --depth=1
          if ((git rev-parse origin/main).Trim() -cne $env:JA_SOURCE_COMMIT) { throw 'source_commit is not current main' }
          $run = gh api "/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:JA_NATIVE_RUN_ID" | ConvertFrom-Json
          if ($run.head_sha -cne $env:JA_SOURCE_COMMIT -or $run.event -cne 'push' -or
              $run.head_branch -cne 'main' -or $run.conclusion -cne 'success' -or
              $run.name -cne 'Ja App Server native matrix') {
            throw 'native run is not the successful main verification for this source'
          }

      - name: Install Node.js 24 for the npm launcher and publisher
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.10.0
          registry-url: https://registry.npmjs.org

      - name: Install the npm version required for Trusted Publishing
        shell: pwsh
        run: npm install -g npm@11.16.0

      - name: Test npm package staging and metadata
        shell: pwsh
        run: node --test packages/ja-npm/tests/*.test.mjs

      - name: Download the verified Windows x64 App Server
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ja-native-reuse-windows-x86_64
          path: ${{ runner.temp }}/ja-native-reuse
          run-id: ${{ inputs.native_run_id }}
          github-token: ${{ github.token }}

      - name: Build the matching Rust CLI
        shell: pwsh
        run: |
          cargo build --locked --release -p ja-cli
          if ($LASTEXITCODE -ne 0) { throw 'CLI release build failed' }

      - name: Stage, inspect, and install the npm tarball
        shell: pwsh
        env:
          JA_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'ja-npm-stage'
          $reuse = Join-Path $env:RUNNER_TEMP 'ja-native-reuse'
          node packages/ja-npm/scripts/stage.mjs `
            --cli 'target/release/ja.exe' `
            --app-server (Join-Path $reuse 'native/ja-agent/ja-app-server/target/ja-app-server.exe') `
            --native-report (Join-Path $reuse 'native/native-evidence/build-report.json') `
            --search-tools (Join-Path $reuse 'tools') `
            --source-commit $env:JA_SOURCE_COMMIT `
            --out $stage
          if ($LASTEXITCODE -ne 0) { throw 'npm staging failed' }
          Push-Location $stage
          try {
            node bin/verify.cjs
            if ($LASTEXITCODE -ne 0) { throw 'npm native verification failed' }
            npm pack --dry-run
            if ($LASTEXITCODE -ne 0) { throw 'npm pack dry run failed' }
            $packed = npm pack --json | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $packed.Count -ne 1) { throw 'npm pack failed' }
            $archive = Join-Path $stage $packed[0].filename
          } finally {
            Pop-Location
          }
          $install = Join-Path $env:RUNNER_TEMP 'ja-npm-install'
          New-Item -ItemType Directory -Path $install | Out-Null
          npm install --offline --ignore-scripts --no-audit --no-fund --prefix $install $archive
          if ($LASTEXITCODE -ne 0) { throw 'clean npm install failed' }
          & (Join-Path $install 'node_modules/.bin/ja.cmd') --help
          if ($LASTEXITCODE -ne 0) { throw 'installed Ja launcher failed' }
          & (Join-Path $install 'node_modules/.bin/ja.cmd') --version
          if ($LASTEXITCODE -ne 0) { throw 'installed Ja version check failed' }
          node packages/ja-npm/scripts/verify-runtime.mjs `
            --package-root (Join-Path $install 'node_modules/@kongweiguang/ja') `
            --evidence-directory (Join-Path $env:RUNNER_TEMP 'ja-npm-candidate-smoke')
          if ($LASTEXITCODE -ne 0) { throw 'installed npm native runtime or bundled file search failed' }

      - name: Preserve the verified npm tarball for first-publish recovery
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ja-npm-windows-x64
          path: ${{ runner.temp }}/ja-npm-stage/*.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Publish and read back the verified public npm package
        shell: pwsh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'ja-npm-stage'
          $version = (Get-Content -Raw -LiteralPath (Join-Path $stage 'package.json') | ConvertFrom-Json).version
          $spec = "@kongweiguang/ja@$version"
          $PSNativeCommandUseErrorActionPreference = $false
          $metadata = npm view $spec --json --registry=https://registry.npmjs.org 2> (Join-Path $env:RUNNER_TEMP 'ja-npm-view.stderr')
          if ($LASTEXITCODE -ne 0) {
            $failure = ($metadata -join "`n") | ConvertFrom-Json
            if ($failure.error.code -cne 'E404') { throw "npm lookup failed: $($failure.error.code)" }
            Push-Location $stage
            try {
              npm publish --access public --registry=https://registry.npmjs.org
              if ($LASTEXITCODE -ne 0) {
                throw 'npm publish failed; configure the npm Trusted Publisher for the calling workflow or supply a first-publish NPM_TOKEN'
              }
            } finally {
              Pop-Location
            }
          }
          # npm 的版本不可覆盖；成功上传后重跑只能验证同源码的已发布包。
          $published = Join-Path $env:RUNNER_TEMP 'ja-npm-published'
          npm install --ignore-scripts --no-audit --no-fund --prefix $published $spec --registry=https://registry.npmjs.org
          if ($LASTEXITCODE -ne 0) { throw 'published npm package could not be installed' }
          $package = Join-Path $published 'node_modules/@kongweiguang/ja'
          node packages/ja-npm/scripts/verify-published.mjs $package $stage
          if ($LASTEXITCODE -ne 0) { throw 'published npm package differs from the verified release' }
          & (Join-Path $published 'node_modules/.bin/ja.cmd') --help
          if ($LASTEXITCODE -ne 0) { throw 'published Ja launcher failed' }
          & (Join-Path $published 'node_modules/.bin/ja.cmd') --version
          if ($LASTEXITCODE -ne 0) { throw 'published Ja version check failed' }
          node packages/ja-npm/scripts/verify-runtime.mjs `
            --package-root $package `
            --evidence-directory (Join-Path $env:RUNNER_TEMP 'ja-npm-published-smoke')
          if ($LASTEXITCODE -ne 0) { throw 'published npm native runtime or bundled file search failed' }
          "Verified public npm package: $spec" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
