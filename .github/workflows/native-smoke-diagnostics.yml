# @author kongweiguang
name: Native smoke diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: macos-26-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ja-native-app-server-macos-x86_64
          run-id: 34318699788
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prior-native
      - name: Probe exact prior native artifact with bounded diagnostics
        shell: bash
        run: |
          set -euo pipefail
          artifact="$(find "$RUNNER_TEMP/prior-native" -type f -name ja-app-server -print -quit)"
          test -n "$artifact"
          chmod +x "$artifact"
          identity="$(python3 -c 'import hashlib,pathlib,sys;p=pathlib.Path(sys.argv[1]);s=p.stat();print(hashlib.sha256(p.read_bytes()).hexdigest(),s.st_size,s.st_mtime_ns)' "$artifact")"
          read -r sha size mtime <<< "$identity"
          uv run --python 3.13 --with 'jsonschema[format]==4.26.0' python -B scripts/native/run-sidecar-smoke.py --executable "$artifact" --data-dir "$RUNNER_TEMP/Ja App Server/unicode 空格 data" --output "$RUNNER_TEMP/smoke.json" --expected-sha256 "$sha" --expected-size "$size" --expected-mtime-ns "$mtime"
