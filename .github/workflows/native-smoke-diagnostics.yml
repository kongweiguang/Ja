# @author kongweiguang
# Temporary diagnostic: reuse the failed candidate binary without changing release gates.
name: Ja native smoke diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows-desktop:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d
        with:
          version: 10.33.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 24.10.0
          cache: pnpm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: liberica
          java-version: "25"
          cache: maven
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: ". -> target"
          shared-key: ja-native-windows-x86_64
          cache-on-failure: true
      - name: Build JVM fixture with JDK 25
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PATH = "$env:JAVA_HOME/bin;$env:PATH"
          java -version
          mvn.cmd -version
          pnpm install --frozen-lockfile --prefer-offline --reporter=append-only
          mvn.cmd -B -ntp -f ja-agent/pom.xml -pl ja-app-server -am -DskipTests package
      - name: Run real Windows desktop smoke
        shell: pwsh
        env:
          JA_E2E_REAL_PROVIDER: "0"
          JA_E2E_KEEP_TEMP: "0"
        run: |
          $env:JA_E2E_APP_SERVER_JAR = (Resolve-Path 'ja-agent/ja-app-server/target/ja-app-server.jar').Path
          $env:JA_E2E_CARGO_TARGET_DIR = Join-Path $PWD 'target'
          "JA_DESKTOP_DIAGNOSTICS=$env:TEMP/ja-e2e-results" | Add-Content $env:GITHUB_ENV
          node scripts/e2e/windows-desktop-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'desktop smoke failed' }
      - name: Scan redacted summaries
        id: summary_scan
        if: always()
        shell: pwsh
        run: python -B scripts/release/check-evidence-secrets.py "$env:TEMP/ja-e2e-results"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() && steps.summary_scan.conclusion == 'success' }}
        with:
          name: ja-windows-desktop-diagnostics
          path: ${{ env.JA_DESKTOP_DIAGNOSTICS }}/*.json
          retention-days: 3
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2]
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ja-native-app-server-macos-arm64
          run-id: 38145833844
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/diagnostic-input
      - name: Run unchanged smoke and retain redacted failure evidence
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/diagnostic-evidence"
          artifact=$(python3 -c 'import pathlib,os; p=[p for p in pathlib.Path(os.environ["RUNNER_TEMP"],"diagnostic-input").rglob("ja-app-server") if p.is_file()]; assert len(p)==1,p; print(p[0])')
          chmod +x "$artifact"
          identity=$(python3 -c 'import pathlib,sys,hashlib; p=pathlib.Path(sys.argv[1]); s=p.stat(); print(hashlib.sha256(p.read_bytes()).hexdigest(),s.st_size,s.st_mtime_ns)' "$artifact")
          read -r sha size mtime <<< "$identity"
          uv run --python 3.13 --with 'jsonschema[format]==4.26.0' python -B scripts/native/run-sidecar-smoke.py \
            --executable "$artifact" --data-dir "$RUNNER_TEMP/diagnostic-profile" \
            --output "$RUNNER_TEMP/diagnostic-evidence/smoke.json" \
            --expected-sha256 "$sha" --expected-size "$size" --expected-mtime-ns "$mtime" --keep-failed-profile
      - name: Collect only redacted diagnostic documents
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,os,json
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          out=root/'diagnostic-evidence'
          out.mkdir(exist_ok=True)
          for i,p in enumerate((root/'diagnostic-profile').rglob('failure-diagnostics.json')):
              d=json.loads(p.read_text())
              safe={k:d[k] for k in ('stage','stderrRedacted','protocolFrames') if k in d}
              (out/f'failure-{i}.json').write_text(json.dumps(safe,ensure_ascii=False,indent=2))
              print(json.dumps({'stage':safe.get('stage'),'stderrRedacted':safe.get('stderrRedacted')},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ja-arm64-smoke-diagnostics-${{ matrix.attempt }}
          path: ${{ runner.temp }}/diagnostic-evidence
          retention-days: 3
