name: Release Ja

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: "Exact successful main commit SHA to sign and release"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  # 发布草稿开始创建后，不同候选版本的发布任务不得互相取消。
  group: ja-release-${{ inputs.source_commit }}
  cancel-in-progress: false

jobs:
  verify-release-candidate:
    name: Verify release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      source_commit: ${{ steps.candidate.outputs.source_commit }}
      verified_run_id: ${{ steps.candidate.outputs.verified_run_id }}
      release_tag: ${{ steps.candidate.outputs.release_tag }}
    steps:
      - name: Checkout the requested source commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 1

      - name: Install pinned pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.33.0
          run_install: false

      - name: Install pinned Node.js for release preflight
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.10.0

      - name: Require current main, verified CI artifacts, and release metadata
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          JA_NPM_BOOTSTRAP_AVAILABLE: ${{ secrets.NPM_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'source_commit must be a full lowercase Git commit SHA' >&2
            exit 1
          fi
          candidate="$(git rev-parse HEAD)"
          test "$candidate" = "$REQUESTED_SOURCE_COMMIT"
          git fetch origin main --depth=1
          test "$candidate" = "$(git rev-parse origin/main)"

          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "unsupported package version: $version" >&2
            exit 1
          fi
          tag="v$version"
          notes="scripts/release/notes/$tag.md"
          if [[ ! -s "$notes" ]]; then
            echo "release notes are missing or empty: $notes" >&2
            exit 1
          fi
          pnpm version:check
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo 'TAURI_SIGNING_PRIVATE_KEY is missing' >&2
            exit 1
          fi
          npm_metadata="$RUNNER_TEMP/ja-npm-preflight.json"
          if ! npm view '@kongweiguang/ja' name --json --registry=https://registry.npmjs.org > "$npm_metadata"; then
            if ! jq -e '.error.code == "E404"' "$npm_metadata" >/dev/null; then
              echo 'npm registry lookup failed; publication state is unknown' >&2
              exit 1
            fi
            if [[ "$JA_NPM_BOOTSTRAP_AVAILABLE" != 'true' ]]; then
              echo 'First npm publication requires the NPM_TOKEN repository secret (granular write token with bypass 2FA).' >&2
              exit 1
            fi
          fi
          releases="$(gh api --paginate --slurp \
            "/repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          if jq -e --arg tag "$tag" 'flatten | any(.[]; .tag_name == $tag)' <<< "$releases" >/dev/null; then
            echo "release already exists: $tag" >&2
            exit 1
          fi
          remote_tag="$(git ls-remote --refs origin "refs/tags/$tag")"
          if [[ -n "$remote_tag" ]]; then
            echo "release tag already exists: $tag" >&2
            exit 1
          fi

          verified_run_id="$(gh api --paginate --slurp \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/native-app-server.yml/runs?event=push&head_sha=$candidate&status=completed&per_page=100" \
            | jq -r --arg sha "$candidate" '
              [ .[] | .workflow_runs[] | select(.event == "push" and .head_branch == "main" and .head_sha == $sha and .conclusion == "success") ]
              | sort_by(.run_started_at)
              | last
              | .id // empty
            ')"
          if [[ -z "$verified_run_id" ]]; then
            echo 'the requested main commit has no successful native-app-server push run' >&2
            exit 1
          fi

          artifacts="$(gh api --paginate --slurp \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$verified_run_id/artifacts?per_page=100")"
          for target in windows-x86_64 macos-x86_64 macos-arm64; do
            name="ja-native-reuse-$target"
            artifact="$(jq -c --arg name "$name" '
              [ .[] | .artifacts[] | select(.name == $name and .expired == false and ((.size_in_bytes // 0) > 0)) ]
              | sort_by(.created_at)
              | last // empty
            ' <<< "$artifacts")"
            if [[ -z "$artifact" || "$artifact" == "null" ]]; then
              echo "verified native reuse artifact is missing, expired, or empty: $name" >&2
              exit 1
            fi
          done

          echo "source_commit=$candidate" >> "$GITHUB_OUTPUT"
          echo "verified_run_id=$verified_run_id" >> "$GITHUB_OUTPUT"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"

  signed-native-matrix:
    name: Sign and assemble release candidate
    needs: verify-release-candidate
    uses: ./.github/workflows/native-app-server.yml
    with:
      release: true
      skip_verification: true
      source_commit: ${{ needs.verify-release-candidate.outputs.source_commit }}
      verified_run_id: ${{ needs.verify-release-candidate.outputs.verified_run_id }}
    secrets: inherit
    permissions:
      contents: write
      actions: read

  publish-npm-cli:
    name: Publish the matching npm CLI
    needs: [verify-release-candidate, signed-native-matrix]
    uses: ./.github/workflows/npm-cli-publish.yml
    with:
      source_commit: ${{ needs.verify-release-candidate.outputs.source_commit }}
      native_run_id: ${{ needs.verify-release-candidate.outputs.verified_run_id }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    permissions:
      contents: read
      actions: read
      id-token: write

  publish-github-release:
    name: Publish GitHub Release after npm verification
    needs: [verify-release-candidate, signed-native-matrix, publish-npm-cli]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Verify and publish the matching GitHub draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JA_SOURCE_COMMIT: ${{ needs.verify-release-candidate.outputs.source_commit }}
          JA_RELEASE_TAG: ${{ needs.verify-release-candidate.outputs.release_tag }}
        run: |
          set -euo pipefail
          release="$(gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$JA_RELEASE_TAG")"
          jq -e --arg sha "$JA_SOURCE_COMMIT" --arg tag "$JA_RELEASE_TAG" \
            '.tag_name == $tag and .target_commitish == $sha and .prerelease == false' \
            <<< "$release" >/dev/null
          assets="$RUNNER_TEMP/ja-release-publication"
          mkdir -p "$assets"
          gh release download "$JA_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$assets"
          jq -e --arg sha "$JA_SOURCE_COMMIT" --arg tag "$JA_RELEASE_TAG" \
            '.product == "Ja" and .sourceCommit == $sha and .tag == $tag and .release.updaterSigning == "verified"' \
            "$assets/artifact-manifest.json" >/dev/null
          jq -e --arg version "${JA_RELEASE_TAG#v}" '.version == $version' "$assets/latest.json" >/dev/null
          (cd "$assets" && sha256sum --check --strict SHA256SUMS)
          if jq -e '.draft == true' <<< "$release" >/dev/null; then
            gh release edit "$JA_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
          gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$JA_RELEASE_TAG" \
            | jq -e --arg sha "$JA_SOURCE_COMMIT" '.draft == false and .target_commitish == $sha' >/dev/null
          echo "Ja $JA_RELEASE_TAG is public on GitHub and npm (@kongweiguang/ja@${JA_RELEASE_TAG#v})." >> "$GITHUB_STEP_SUMMARY"
