# Maven Native 插件同样持有 fail-closed 参数；这里重复稳定参数是为了保持独立元数据入口。
# 显式反射元数据覆盖 Logback setter 与有界 MCP tools DTO，因为闭世界分析会裁剪未观察到的访问器。
# Solon 根据 NativeDetector 的 AOT 标记决定是否启动 HTTP/WebSocket；不得将镜像构建状态固化到运行时。
Args = --no-fallback --initialize-at-run-time=org.noear.solon.core.runtime.NativeDetector -H:ReflectionConfigurationResources=META-INF/native-image/io/github/kongweiguang/ja/logback-reflect-config.json,META-INF/native-image/io/github/kongweiguang/ja/solon-composition-reflect-config.json,META-INF/native-image/io/github/kongweiguang/ja/mcp-sdk-reflect-config.json
