# Maven Native 插件同样持有 fail-closed 参数；这里重复稳定参数是为了保持独立元数据入口。
# 显式反射元数据覆盖 Logback setter 与有界 MCP tools DTO，因为闭世界分析会裁剪未观察到的访问器。
Args = --no-fallback -H:ReflectionConfigurationResources=META-INF/native-image/io/github/kongweiguang/ja/logback-reflect-config.json,META-INF/native-image/io/github/kongweiguang/ja/solon-composition-reflect-config.json,META-INF/native-image/io/github/kongweiguang/ja/mcp-sdk-reflect-config.json
