# @author kongweiguang

[package]
name = "ja-cli"
version.workspace = true
description = "Ja command-line terminal interface"
authors = ["kongweiguang"]
license = "GPL-3.0-or-later"
repository = "https://github.com/kongweiguang/ja"
edition = "2024"
rust-version = "1.88"

[dependencies]
arboard = { version = "=3.6.1", default-features = false }
base64 = "=0.22.1"
ctrlc = "=3.5.0"
crossterm = { version = "=0.28.1", features = ["bracketed-paste"] }
ja-runtime = { path = "../../crates/ja-runtime" }
ja-review = { path = "../../crates/ja-review" }
pulldown-cmark = "=0.13.0"
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
textwrap = { version = "=0.16.2", default-features = false, features = ["unicode-linebreak", "unicode-width"] }
unicode-segmentation = "=1.12.0"
uuid = { version = "=1.24.1", features = ["v4"] }
unicode-width = "=0.2.0"

[target.'cfg(windows)'.dependencies]
which = "=8.0.0"
windows = { version = "=0.61.3", default-features = false, features = ["std", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console"] }

[[bin]]
name = "ja"
path = "src/main.rs"

